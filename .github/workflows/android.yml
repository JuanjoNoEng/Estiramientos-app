# Compila la app de Android (APK) con Capacitor.
# - En cada push: deja la APK como artefacto descargable de la ejecución.
# - Al subir una etiqueta v* (p. ej. v1.0.0): publica la APK en "Releases" con el nombre fijo
#   (v1.0.0-prueba y similares se publican como pre-lanzamiento: no reemplazan la descarga principal)
#   estiramientos-andrey-hernandez.apk, que es el enlace de descarga que usa la app.
# Firma: si existen los secretos ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS y
# ANDROID_KEY_PASSWORD, se firma como versión final (las actualizaciones se instalan encima de la anterior).
# Sin ellos se genera una APK de prueba (debug).
name: APK Android

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# Si llega un push nuevo a la misma rama, se cancela la compilación anterior
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias y compilar la web
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Preparar firma (si hay secretos)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "TAREA=assembleRelease" >> "$GITHUB_ENV"
            echo "SALIDA=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin secretos de firma: se genera una APK de prueba (debug)."
            echo "TAREA=assembleDebug" >> "$GITHUB_ENV"
            echo "SALIDA=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          fi

      - name: Compilar APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('1.0.{0}', github.run_number) }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew "$TAREA" --no-daemon

      - name: Renombrar
        run: |
          mkdir -p salida
          cp "$SALIDA" salida/estiramientos-andrey-hernandez.apk

      - uses: actions/upload-artifact@v4
        with:
          name: estiramientos-andrey-hernandez-apk
          path: salida/estiramientos-andrey-hernandez.apk

      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: salida/estiramientos-andrey-hernandez.apk
          name: Estiramientos ${{ github.ref_name }}
          # Las etiquetas con guion (p. ej. v0.9.0-prueba) son versiones de prueba: no cuentan como "la última"
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: App de estiramientos de Andrey Hernández, Quiropráctico, para Android.
